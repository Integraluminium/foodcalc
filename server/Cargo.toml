[package]
name = "server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[features]
default = ["mcp"]
typst = ["dep:pdf_export"]
mcp = ["dep:rmcp", "dep:schemars"]

[dependencies]
axum.workspace = true
bcrypt = "0.16.0"
foodlib_new = { path = "../foodlib_new", features = ["axum"] }
pdf_export = { path = "../pdf_export", optional = true }
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server", "request-state", "elicitation"], optional = true }
schemars = { version = "1", optional = true }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
fern = { version = "0.6", features = ["colored"] }
maud.workspace = true

axum-login = { workspace = true }
axum-extra = "*"
num = { workspace = true }
dotenv = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
time = { workspace = true }
log = { workspace = true }
bigdecimal = { workspace = true }
futures = { workspace = true }
serde_json = "1"
tower-sessions = { version = "0.14.0", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
urlencoding = "2"
eyre = "0.6.14"
mcp = "0.1.1"
rand = "0.8.5"
sha2 = "0.10.8"
hex = "0.4.3"
