openapi: 3.0.3
info:
  title: Foodcalc REST API
  description: >
    API-Spezifikation für die Foodcalc-Applikation. Zuständig für Event-Planung, 
    Rezeptverwaltung, Logistik und PDF-Generierung für Groß-Caterings.
  version: 1.1.0
servers:
  - url: http://localhost:3000/api
    description: Lokaler Entwicklungsserver

tags:
  - name: Auth
    description: Authentifizierung und Session-Management
  - name: Groups
    description: Benutzergruppen (Owner-Management)
  - name: Ingredients
    description: Basis-Zutatenverwaltung
  - name: Inventories
    description: Lager und Bestandsverwaltung
  - name: Events
    description: Verwaltung von Veranstaltungen und Budgets
  - name: Event Meals
    description: Mahlzeitenplanung für spezifische Events
  - name: Event Logistics
    description: Einkaufsfahrten, Zutaten-Overrides und Lieferungen
  - name: Recipes
    description: Globaler Katalog für Gerichte und Komponenten
  - name: Exports
    description: Generierung von PDFs und Labels

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EventIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    MealIdParam:
      in: path
      name: meal_id
      required: true
      schema:
        type: string
        format: uuid
    RecipeIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    LoginCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    AuthToken:
      type: object
      properties:
        token:
          type: string
        expires_in:
          type: integer

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Ingredient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        energy_kj_per_g:
          type: number
        comment:
          type: string
          nullable: true

    Inventory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string

    EventSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        date_range:
          type: string
        budget:
          type: number
        owner:
          type: string

    EventCreate:
      type: object
      required: [name, budget, owner_group_id]
      properties:
        name:
          type: string
        date_range:
          type: string
        budget:
          type: number
        owner_group_id:
          type: string
          format: uuid

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties:
            total_expected_cost:
              type: number
            planned_meals_count:
              type: integer

    PlannedMeal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipe_id:
          type: string
          format: uuid
        name:
          type: string
        start_time:
          type: string
          format: date-time
        portions:
          type: integer
        energy_per_portion_kj:
          type: number
        price_per_portion:
          type: number
        total_price:
          type: number
        is_custom_copy:
          type: boolean

    MealAdd:
      type: object
      required: [recipe_id, portions, target_energy_kj]
      properties:
        recipe_id:
          type: string
          format: uuid
        portions:
          type: integer
        target_energy_kj:
          type: number
        is_custom_copy:
          type: boolean
          default: false

    MealUpdate:
      type: object
      properties:
        portions:
          type: integer
        target_energy_kj:
          type: number
        start_time:
          type: string
          format: date-time

    EventLogistics:
      type: object
      properties:
        shopping_tours:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              date_time:
                type: string
                format: date-time
              store_name:
                type: string
        overrides:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              ingredient_name:
                type: string
              new_store_name:
                type: string
        inventory_arrivals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              item_name:
                type: string
              source_name:
                type: string
              eta:
                type: string
                format: date-time
              status:
                type: string
                enum: [Pending, Planned, Arrived]

    RecipeSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [meal, component]
        owner:
          type: string
        energy_kj_g:
          type: number

    RecipeCreate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [meal, component]
        owner_group_id:
          type: string
          format: uuid

    RecipeCloneRequest:
      type: object
      properties:
        new_name:
          type: string
          description: Optionaler neuer Name für das geklonte Rezept
        target_event_id:
          type: string
          format: uuid
          description: Falls gesetzt, wird das Rezept als Event-spezifische Kopie (Custom) geklont.

    RecipeTree:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        amount:
          type: number
        unit:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/RecipeTree'

